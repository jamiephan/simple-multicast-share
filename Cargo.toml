[package]
name = "simple-multicast-share"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
hostname = "0.4"
http = "1"
http-body-util = "0.1"
if-addrs = "0.14"
mdns-sd = "0.13"
mime_guess = "2"
rusqlite = { version = "0.32", features = ["blob", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
