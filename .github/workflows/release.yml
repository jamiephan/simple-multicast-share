name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: simple-multicast-share-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: simple-multicast-share-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: simple-multicast-share-macos-arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            asset: simple-multicast-share-macos-x86_64
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            asset: simple-multicast-share-linux-arm64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: simple-multicast-share-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "./target/${{ matrix.target }}/release/simple-multicast-share.exe" "dist/${{ matrix.asset }}"
          else
            cp "./target/${{ matrix.target }}/release/simple-multicast-share" "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: dist/*
